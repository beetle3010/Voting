<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wohnzimmer TOP 32 – Abstimmung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, ruhig, wie ein Einrichtungsmagazin
   IDEA: Musterbuch eines Einrichtungshauses – jede Variante eine Doppelseite
   PICTURE: die zwei zusammengehörigen Fotos groß nebeneinander
   COLOUR: warmes Papier, Salbeigrün als Leitfarbe, Rost als Akzent (Sterne)
   LAYOUT: Kopf, dann je Variante Bildpaar + Bewertung, Ergebnisse unten */
:root{color-scheme:light dark;
--bg:light-dark(#f6f1ea,#171512);--card:light-dark(#fffdf9,#221f1b);--ink:light-dark(#2a2520,#efe8de);
--muted:light-dark(#6f665c,#a99f93);--line:light-dark(#e4dccf,#3a342d);--sage:light-dark(#5b6e4f,#9fb38f);--rust:#b5532f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.08;text-wrap:balance;margin:0}
header{padding:clamp(32px,5vw,64px) max(5vw,16px) 24px;max-width:1240px;margin:auto;display:grid;gap:20px;grid-template-columns:1.3fr 1fr;align-items:end}
header h1{font-size:clamp(34px,5vw,52px)}
header p{margin:10px 0 0;color:var(--muted);max-width:60ch}
.who{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.who label{font-weight:600;display:block;margin-bottom:6px}
.who input{width:100%;font:16px Inter,sans-serif;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.who small{color:var(--muted);display:block;margin-top:6px}
main{max-width:1240px;margin:auto;padding:0 max(5vw,16px) 40px;display:grid;gap:28px}
.v{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pics{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;background:var(--line)}
.pics button{all:unset;cursor:zoom-in;display:block;aspect-ratio:4/3;overflow:hidden}
.pics img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.pics button:hover img{transform:scale(1.03)}
.body{padding:18px 20px 20px;display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:center}
.body h2{font-size:clamp(24px,3vw,32px)}
.tag{font:600 13px Inter;color:var(--sage);margin-bottom:4px}
.desc{color:var(--muted);margin:6px 0 0;max-width:70ch}
.stars{display:flex;gap:4px;align-items:center}
.stars button{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.stars button:focus-visible{outline:2px solid var(--sage)}
.stars svg{width:32px;height:32px;fill:none;stroke:var(--rust);stroke-width:1.6;transition:fill .15s}
.stars button.on svg{fill:var(--rust)}
.stars .zero{width:auto;padding:0 10px;font:500 14px Inter;color:var(--muted);border:1px solid var(--line)}
.stars .zero.on{background:var(--ink);color:var(--bg)}
.res{grid-column:1/-1;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.bar{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:var(--sage);width:0;transition:width .6s}
.saved{color:var(--sage);font-weight:600}
#rank{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
#rank h2{font-size:28px;margin-bottom:12px}
#rank ol{margin:0;padding-left:22px}#rank li{padding:6px 0;border-bottom:1px solid var(--line)}
.note{color:var(--muted);font-size:14px}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:94vh}
dialog img{max-width:96vw;max-height:94vh;border-radius:10px;display:block}
dialog::backdrop{background:rgba(0,0,0,.85)}
@media(max-width:720px){header{grid-template-columns:1fr}.body{grid-template-columns:1fr}.pics{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Welches Wohnzimmer soll's werden?</h1>
    <p>Acht Einrichtungsideen für die neue Wohnung, jeweils der Blick Richtung Balkon und Richtung Küche. Gib jeder Variante 0 bis 5 Sterne – du kannst deine Wertung jederzeit ändern.</p>
  </div>
  <div class="who">
    <label for="name">Dein Name</label>
    <input id="name" autocomplete="given-name" placeholder="z. B. Lisa">
    <small>Damit jede Person nur eine Stimme pro Variante hat.</small>
  </div>
</header>
<main id="list"></main>
<main><section id="rank"><h2>Zwischenstand</h2><ol id="ranklist"></ol><p class="note" id="status"></p></section></main>
<dialog id="zoom"><img alt=""></dialog>
<script>
{
// Nach dem Einrichten des Google-Skripts hier die Web-App-URL eintragen:
const SCRIPT_URL = "";

const V=[
 {id:"lutz-ikea",tag:"Variante 1",name:"Lutz × IKEA",d:"Grünes Dieter-Knoll-Bouclé-Sofa, Vintage-Teppich, Wildeichen-Esstisch mit rostfarbenen Drehsesseln, helle Eiche.",img:["1a","1b"]},
 {id:"organic-akazie",tag:"Variante 2",name:"Organic Modern – Akazie",d:"Teakwurzel-Couchtisch mit Glasplatte, Akazien-Lowboard, Akazien-Esstisch, Rattan-Deckenleuchte, Bogenlampe mit LED-Ring.",img:["2a","2b"]},
 {id:"organic-mango",tag:"Variante 3",name:"Organic Modern – Mango",d:"Teakwurzel-Couchtisch, Mango-Lowboard mit Wiener Geflecht, Wildeichen-Esstisch, schwarze Bogenleuchte CURVE.",img:["3a"]},
 {id:"olive-travertin",tag:"Variante 4",name:"Olive & Travertin",d:"Grünes Sofa, ovaler Travertin-Couchtisch, Terracotta-Prints, Bogenlampe mit Plisseeschirm, Nussbaum.",img:["4a","4b"]},
 {id:"curry-terracotta",tag:"Variante 5",name:"Curry & Terracotta",d:"Curryfarbenes Sofa, organischer Couchtisch, Vintage-Teppich, gerilltes Nussbaum-Lowboard, Messing-Leuchten.",img:["5a","5b"]},
 {id:"modern-vintage",tag:"Variante 6",name:"Modern Vintage",d:"Cognac-Ledersofa, olivgrüner Samtsessel, Perserteppich, Nussbaum, goldene Bogenleuchte.",img:["6a","6b"]},
 {id:"curry-marmor",tag:"Variante 7",name:"Curry & Marmor",d:"Curry-Sofa, Marmor-Couchtisch, Hochflor-Teppich, Natursteintisch, abstraktes Ölgemälde, LED-Ring-Bogenlampe.",img:["7a","7b"]},
 {id:"curry-angelcerda",tag:"Variante 8",name:"Curry & Angel Cerdá",d:"Curry-Sofa, Marmor-Nussbaum-Couchtisch und Stühle von Angel Cerdá, gerillter Esstisch, LED-Ring-Bogenlampe.",img:["8a","8b","8c"]}
];
const star='<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let voter=ls.get("wz-voter");if(!voter){voter=Math.random().toString(36).slice(2)+Date.now().toString(36);ls.set("wz-voter",voter)}
let mine={};try{mine=JSON.parse(ls.get("wz-mine")||"{}")}catch(e){}
let results={};
const nameEl=document.getElementById("name");nameEl.value=ls.get("wz-name")||"";
nameEl.addEventListener("input",()=>ls.set("wz-name",nameEl.value.trim()));

const list=document.getElementById("list");
list.innerHTML=V.map(v=>`<article class="v" id="${v.id}">
 <div class="pics" style="--n:${v.img.length}">${v.img.map((f,i)=>`<button data-src="img/${f}.jpg" aria-label="${esc(v.name)} Bild ${i+1} vergrößern"><img src="img/${f}.jpg" loading="lazy" alt="${esc(v.name)}, Ansicht ${i+1}"></button>`).join("")}</div>
 <div class="body"><div><div class="tag">${v.tag}</div><h2>${esc(v.name)}</h2><p class="desc">${esc(v.d)}</p></div>
 <div class="stars" role="radiogroup" aria-label="Bewertung ${esc(v.name)}">
  <button class="zero" data-v="${v.id}" data-s="0" role="radio">0</button>
  ${[1,2,3,4,5].map(s=>`<button data-v="${v.id}" data-s="${s}" role="radio" aria-label="${s} Sterne">${star}</button>`).join("")}
 </div>
 <div class="res"><span class="avg">–</span><div class="bar"><i></i></div><span class="cnt"></span><span class="saved"></span></div></div></article>`).join("");

function paint(){
 for(const v of V){
  const el=document.getElementById(v.id),m=mine[v.id];
  el.querySelectorAll(".stars button").forEach(b=>{const s=+b.dataset.s;b.classList.toggle("on",m!==undefined&&(s===0?m===0:s<=m));b.setAttribute("aria-checked",m===s)});
  const r=results[v.id];
  el.querySelector(".avg").textContent=r&&r.n?`Ø ${r.avg.toFixed(1)} ★`:"noch keine Stimmen";
  el.querySelector(".bar i").style.width=r&&r.n?(r.avg/5*100)+"%":"0";
  el.querySelector(".cnt").textContent=r&&r.n?`${r.n} ${r.n===1?"Stimme":"Stimmen"}`:"";
 }
 const ranked=V.filter(v=>results[v.id]&&results[v.id].n).sort((a,b)=>results[b.id].avg-results[a.id].avg);
 document.getElementById("ranklist").innerHTML=ranked.length?ranked.map(v=>`<li><a href="#${v.id}">${esc(v.name)}</a> – Ø ${results[v.id].avg.toFixed(1)} ★ (${results[v.id].n})</li>`).join(""):"<li>Noch keine Stimmen.</li>";
}
async function load(){
 const st=document.getElementById("status");
 if(!SCRIPT_URL){st.textContent="Hinweis: Die gemeinsame Auswertung ist noch nicht verbunden – deine Sterne werden nur in diesem Browser gespeichert.";
  results={};for(const v of V){if(mine[v.id]!==undefined)results[v.id]={avg:mine[v.id],n:1}}paint();return}
 try{const r=await fetch(SCRIPT_URL+"?t="+Date.now());results=await r.json();st.textContent="Aktualisiert "+new Date().toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});}
 catch(e){st.textContent="Ergebnisse konnten gerade nicht geladen werden."}
 paint();
}
async function vote(id,s){
 const name=nameEl.value.trim();
 if(!name){nameEl.focus();nameEl.placeholder="Bitte zuerst deinen Namen eingeben";return}
 mine[id]=s;ls.set("wz-mine",JSON.stringify(mine));paint();
 const saved=document.querySelector(`#${id} .saved`);saved.textContent="speichere…";
 if(SCRIPT_URL){try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({voter,name,design:id,stars:s})});saved.textContent="✓ gespeichert";setTimeout(load,1200)}
  catch(e){saved.textContent="Fehler – bitte nochmal"}}
 else{saved.textContent="✓ lokal gespeichert";load()}
}
list.addEventListener("click",e=>{
 const b=e.target.closest(".stars button");if(b){vote(b.dataset.v,+b.dataset.s);return}
 const p=e.target.closest(".pics button");if(p){const d=document.getElementById("zoom");d.querySelector("img").src=p.dataset.src;d.showModal()}
});
document.getElementById("zoom").addEventListener("click",e=>e.currentTarget.close());
paint();load();setInterval(()=>{if(SCRIPT_URL&&!document.hidden)load()},30000);
}
</script>
</body>
</html>
